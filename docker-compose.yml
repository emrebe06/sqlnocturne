services:
  sqlnocturne:
    build: .
    environment:
      SQLNOCTURNE_DATABASE: sqlite:////data/app.db
    volumes:
      - sqlnocturne-data:/data
    command: ["python", "-m", "sqlnocturne.cli.main", "check"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nocturne
      POSTGRES_USER: nocturne
      POSTGRES_PASSWORD: nocturne
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: nocturne
      MYSQL_USER: nocturne
      MYSQL_PASSWORD: nocturne
      MYSQL_ROOT_PASSWORD: nocturne_root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  sqlnocturne-data:
  postgres-data:
  mysql-data:
